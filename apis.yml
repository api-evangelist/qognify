aid: qognify
name: Qognify
description: >-
  Qognify is an enterprise physical-security software provider whose portfolio
  spans video management systems (Ocularis, Qognify VMS formerly Cayuga, and
  NiceVision), physical security information management / PSIM (Situator), and
  video analytics used to protect critical infrastructure, transportation,
  utilities, and enterprise campuses worldwide. The business was formed in 2015
  when Battery Ventures acquired NICE Systems' physical security unit, and was
  acquired by Hexagon AB in 2023, becoming part of Hexagon's safety and security
  operations. The brand and products are transitioning to Octave Security, with
  next-generation offerings delivered under the Coda line (formerly HxGN dC3).
  Qognify sells through channel partners and does not publish a public developer
  API, SDK, or developer portal; integrations are handled via partner and
  professional-services channels and the Hexagon support organization.
